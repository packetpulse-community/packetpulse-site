<svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric network grid illustration">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.15" />
    </radialGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <circle cx="280" cy="280" r="230" fill="url(#glow)" />

  <!-- Isometric cube grid: each <g> is one cube (top diamond + two side faces) -->
  <g id="cube-template">
    <path d="M0,-24 L28,-10 L0,4 L-28,-10 Z" fill="url(#cubeTop)" />
    <path d="M-28,-10 L0,4 L0,32 L-28,18 Z" fill="url(#cubeLeft)" />
    <path d="M28,-10 L0,4 L0,32 L28,18 Z" fill="url(#cubeRight)" />
  </g>

  <g stroke="none">
    <use href="#cube-template" transform="translate(200,180)" />
    <use href="#cube-template" transform="translate(256,208)" />
    <use href="#cube-template" transform="translate(312,180)" />
    <use href="#cube-template" transform="translate(368,208)" />

    <use href="#cube-template" transform="translate(200,236)" />
    <use href="#cube-template" transform="translate(256,264)" />
    <use href="#cube-template" transform="translate(312,236)" />
    <use href="#cube-template" transform="translate(368,264)" />

    <use href="#cube-template" transform="translate(200,292)" />
    <use href="#cube-template" transform="translate(256,320)" />
    <use href="#cube-template" transform="translate(312,292)" />
    <use href="#cube-template" transform="translate(368,320)" />

    <use href="#cube-template" transform="translate(200,348)" />
    <use href="#cube-template" transform="translate(256,376)" />
    <use href="#cube-template" transform="translate(312,348)" />
    <use href="#cube-template" transform="translate(368,376)" />
  </g>

  <!-- Floating accent shapes, matching the reference's teal/indigo/purple confetti -->
  <rect x="420" y="90" width="64" height="64" rx="16" transform="rotate(18 452 122)" fill="#14b8a6" />
  <rect x="70" y="360" width="70" height="70" rx="18" transform="rotate(-12 105 395)" fill="#6366f1" />
  <circle cx="470" cy="420" r="26" fill="#a855f7" />
</svg>
