name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Real Postgres/Redis so the identity module's e2e regression tests (plan Phase 1
    # step 4 — the old app's password-rehash and refresh-token-reuse bugs, among
    # others) run against the genuine database, not mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: packetpulse
          POSTGRES_PASSWORD: packetpulse
          POSTGRES_DB: packetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packetpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://packetpulse:packetpulse@localhost:5432/packetpulse
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-use-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-use-only
      ADMIN_SECURE_CODE: ci-test-admin-secure-code
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's own postinstall can't auto-detect the schema location in a
      # monorepo (apps/backend/prisma/schema.prisma isn't a default search path), so
      # `pnpm install` alone silently ships a stale/mismatched client — explicit here
      # rather than relying only on the backend's own postinstall script.
      - name: Generate Prisma Client
        run: pnpm --filter @packetpulse/backend run prisma:generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Run database migrations
        run: pnpm --filter @packetpulse/backend exec prisma migrate deploy

      - name: Seed roles and permissions
        run: pnpm --filter @packetpulse/backend run prisma:seed

      # tshark is the independent check for the network simulator (packages/netsim): its tests
      # export every scenario as a .pcap and have Wireshark's dissector verify each packet.
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Test
        run: pnpm turbo run test

      - name: E2E test (identity module regressions)
        run: pnpm --filter @packetpulse/backend run test:e2e

      # Builds AND boots the actual production image against the same Postgres/Redis
      # already running in this job — "docker build succeeds" previously masked a
      # real crash (Prisma's musl engine needs a matching OpenSSL target + Alpine's
      # base image has no system OpenSSL at all) that only showed up when the image
      # was actually run, not just built (plan §11 testing discipline).
      - name: Build production Docker image
        run: docker build -f apps/backend/Dockerfile -t packetpulse-backend:ci .

      - name: Smoke-test production Docker image
        run: |
          docker run --rm -d --name backend-smoke-test --network host \
            -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e ADMIN_SECURE_CODE="$ADMIN_SECURE_CODE" -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e NODE_ENV=production -e PORT=4000 \
            packetpulse-backend:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/health; then echo "Container healthy"; exit 0; fi
            sleep 2
          done
          echo "Container failed health check within timeout"
          docker logs backend-smoke-test
          exit 1

  # Security checks run as their own jobs so they start in parallel with `build` and
  # a failure shows up as its own red check. To make a failed check block release,
  # mark `build` and `secret-scan` (and later `dependency-audit`) as required status
  # checks in the repository's branch protection rules for `main` (a GitHub setting,
  # not expressible in this file).

  # Secret scan: gitleaks over the whole git history, not just the latest commit, so
  # a secret that was committed and later deleted is still caught. Blocking: a real
  # leak means "rotate it", never "ignore". The image tag is pinned to an exact
  # version; findings are redacted in the log. Runs the CLI in Docker rather than
  # gitleaks-action, whose organisation use requires a paid license key.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the scan

      - name: Scan history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --verbose --log-opts="--all"

  # Dependency audit: production dependencies only, high severity and above.
  # REPORT-ONLY (continue-on-error) for now: on 2026-11-16 the audit already reported
  # 36 high and 7 critical findings (next, tar, multer, nodemailer, body-parser,
  # proxy-addr, ...), mostly needing framework upgrades, so a blocking step would
  # turn every pull request red. Fix the findings (tracked under TASK-011), then
  # delete `continue-on-error` so the audit blocks.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Audit production dependencies (high and above)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
