name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Real Postgres/Redis so the identity module's e2e regression tests (plan Phase 1
    # step 4 — the old app's password-rehash and refresh-token-reuse bugs, among
    # others) run against the genuine database, not mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: packetpulse
          POSTGRES_PASSWORD: packetpulse
          POSTGRES_DB: packetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packetpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://packetpulse:packetpulse@localhost:5432/packetpulse
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-use-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-use-only
      ADMIN_SECURE_CODE: ci-test-admin-secure-code
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Run database migrations
        run: pnpm --filter @packetpulse/backend exec prisma migrate deploy

      - name: Seed roles and permissions
        run: pnpm --filter @packetpulse/backend run prisma:seed

      - name: Test
        run: pnpm turbo run test

      - name: E2E test (identity module regressions)
        run: pnpm --filter @packetpulse/backend run test:e2e

      # Builds AND boots the actual production image against the same Postgres/Redis
      # already running in this job — "docker build succeeds" previously masked a
      # real crash (Prisma's musl engine needs a matching OpenSSL target + Alpine's
      # base image has no system OpenSSL at all) that only showed up when the image
      # was actually run, not just built (plan §11 testing discipline).
      - name: Build production Docker image
        run: docker build -f apps/backend/Dockerfile -t packetpulse-backend:ci .

      - name: Smoke-test production Docker image
        run: |
          docker run --rm -d --name backend-smoke-test --network host \
            -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e ADMIN_SECURE_CODE="$ADMIN_SECURE_CODE" -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e NODE_ENV=production -e PORT=4000 \
            packetpulse-backend:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4000/api/health; then echo "Container healthy"; exit 0; fi
            sleep 2
          done
          echo "Container failed health check within timeout"
          docker logs backend-smoke-test
          exit 1
